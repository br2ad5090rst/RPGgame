<style>

<script>

const CL={
 검사:{t:['검사','검성','검황'],hp:140,atk:10,r:60,c:'#e66',w:'검',s:['강타','회전 베기','전투 의지']},
 궁수:{t:['궁수','저격수','신궁'],hp:100,atk:11,r:170,c:'#6c6',w:'활',s:['관통 사격','화살비','응급 처치']},
 마법사:{t:['마법사','대마법사','현자'],hp:90,atk:13,r:150,c:'#69f',w:'지팡이',s:['화염구','블리자드','마나 치유']},
 도적:{t:['도적','암살자','그림자 군주'],hp:110,atk:12,r:55,c:'#a6c',w:'단검',s:['급소 찌르기','쿠나이 난무','은신 회복']},
 기사:{t:['기사','용기사','드래곤기사'],hp:170,atk:9,r:60,c:'#fc4',w:'창',s:['창 돌격','대지 강타','성스러운 가호']}};
const ZN=['슬라임 숲','고블린 동굴','얼음 협곡','용의 계곡','마왕의 성','최종 보스전','레이드'],ZS=[1,11,21,31,41,50,50],
 ZC=['#1f3a1f','#33281c','#1c2d3d','#3a1f1f','#2b1a33','#12091a'],MC=['#4c4','#8a5','#8cf','#e84','#c4c','#f33','#d22'],
 MN=['슬라임','고블린','얼음 정령','와이번','마족','마왕','용왕'],PF=['초보자 ','고블린 ','서리 ','용비늘 ','마왕 ','심연의 ','용왕의 '],
 GR=['일반','고급','희귀','영웅','전설','신화'],GC=['#999','#4a4','#38e','#a4f','#e90','#e34'];
const WW=1600,GY=380,PL=[[0,GY,WW],[120,290,230],[560,290,230],[1000,290,230],[330,200,220],[770,200,220],[1220,200,220]].map(a=>({x:a[0],y:a[1],w:a[2]}));
const BG=[['#7cc8ff','#e3f6ff'],['#3b2b3f','#9a6a4a'],['#8fc4f0','#f0fbff'],['#4a1f1f','#e0703a'],['#1a0f2b','#5b3380'],['#05020a','#3a0b4a'],['#12000a','#b01a3a']],
 GD=['#7a5230','#54402e','#7a8a9a','#6a4030','#40305a','#30204a','#3a1020'],GG=['#5c5','#7a5','#dff','#b74','#96c','#b4d','#f55'];
let P=null,zn=0,E=[],PR=[],PJ=[],FX=[],keys={},msgs=[],boss=null,last=0,T=0,cam=0,BP=[],SP=[],shake=0;
const need=L=>Math.floor(25*L**1.8*2),sc=i=>i?(10+i.z*18)*(1+i.g*.5)*(1+i.plus*.12):0,
 atk=()=>(CL[P.cls].atk+P.lv*3+sc(P.eq.w))*(1+.3*P.tier),mhp=()=>CL[P.cls].hp+P.lv*20+sc(P.eq.a)*3,
 nm=i=>`<span style="color:${GC[i.g]}">${i.n}</span>`,rnd=Math.random;
let DLG=0;const Q=a=>({t:a[0],k:a[1],n:a[2],a:a[3],d:a[4],r:a[5]}),
NP=[
{n:'촌장 마르코',c:'#b57',h:'#ccc',s:'어서 오게, 젊은 용사여. 요즘 슬라임 숲의 기운이 이상하네. 마왕의 부활 징조인 것 같아…',e:'자네 덕분에 숲이 평화로워졌네. 고블린 동굴 쪽을 조심하게!',q:[['슬라임 15마리 처치','kill',15,'숲을 어지럽히는 슬라임을 15마리만 처치해 주게.','고맙네! 약소하지만 보상일세.',[150,.3,3,-1]],['숲의 보스 처치','boss',1,'숲 깊은 곳에 우두머리가 있다네. 놈을 쓰러뜨려 주게!','해냈구나! 마왕의 흔적은 고블린 동굴로 이어지고 있다고 하네.',[400,.5,5,2]]].map(Q)},
{n:'광부 브란',c:'#7a5',h:'#a63',s:'폐광이 고블린들에게 점령당했어! 동료 광부들이 아직 갇혀 있다고!',e:'덕분에 광부들을 구했어. 광산 벽에서 마왕의 문장을 발견했지. 얼음 협곡으로 가보게.',q:[['고블린 20마리 처치','kill',20,'입구를 막고 있는 고블린 20마리를 처치해 줘!','대단해! 길이 뚫렸어.',[300,.3,4,-1]],['고블린 두목 처치','boss',1,'광산 깊은 곳의 두목만 쓰러뜨리면 끝이야!','두목이 마왕의 문장이 새겨진 돌을 떨어뜨렸어. 협곡의 현자를 찾아가 봐.',[800,.5,6,3]]].map(Q)},
{n:'설원의 현자 엘사',c:'#6ad',h:'#eef',s:'협곡의 얼음이 마왕의 기운에 깨어나고 있어요. 봉인의 조각이 위험해요…',e:'봉인의 조각을 모았군요. 이제 용의 계곡으로 향하세요.',q:[['얼음 정령 25마리 처치','kill',25,'폭주한 얼음 정령 25마리를 진정시켜 주세요.','정령들이 잠잠해졌어요. 고마워요.',[600,.3,5,-1]],['협곡의 보스 처치','boss',1,'얼음 던전의 수호자가 봉인 조각을 품고 있어요. 되찾아 주세요!','봉인의 조각을 되찾았군요! 이 조각은 마왕을 막을 열쇠예요.',[1500,.5,8,3]]].map(Q)},
{n:'용족 장로 이그니스',c:'#d63',h:'#fc6',s:'용의 계곡의 와이번들이 마왕에게 조종당하고 있다. 용족의 자존심을 지켜다오.',e:'용족의 축복이 그대와 함께하길. 이제 마왕의 성으로 가라!',q:[['와이번 30마리 처치','kill',30,'조종당하는 와이번 30마리를 쓰러뜨려 주게.','그들의 영혼도 편히 쉴 것이다.',[1000,.3,6,-1]],['계곡의 보스 처치','boss',1,'고대 유적의 수호룡을 해방시켜 주게.','수호룡이 해방되었다! 용족의 축복을 받아라!',[2500,.5,10,4]]].map(Q)},
{n:'기사단장 레온',c:'#58c',h:'#fa3',s:'마왕의 성이 눈앞이다. 이곳이 마지막 관문이지. 준비는 되었나?',e:'50레벨이 되면 마왕에게 도전할 수 있다. 행운을 빈다, 용사여!',q:[['마족 35마리 처치','kill',35,'성을 지키는 마족 35마리를 처치하라!','훌륭하다! 성문이 열렸다.',[1800,.3,8,-1]],['성의 보스 처치','boss',1,'성의 수문장을 쓰러뜨려라. 그러면 마왕에게 닿을 수 있다.','수문장을 쓰러뜨렸군! 이제 50레벨이 되면 마왕이 기다린다.',[4000,.5,12,4]]].map(Q)},
{n:'영웅의 유령 아델',c:'#9ac',h:'#fff',s:'나는 과거 마왕에게 패한 영웅… 마왕을 쓰러뜨릴 자는 이제 그대뿐이다.',e:'세상은 구원받았다. 하지만 용왕이 깨어났다는 소문이 들린다…',q:[['마왕 처치','boss',1,'마왕을 쓰러뜨려 이 세상을 구해다오!','마침내 해냈구나! 그대는 진정한 영웅이다. 세상이 구원받았다!',[10000,0,20,5]]].map(Q)},
{n:'예언자 시빌',c:'#c4a',h:'#f8f',s:'용왕 바르카스가 분노하고 있어요. 그를 잠재울 수 있는 건 당신뿐이에요.',e:'용왕이 잠들었어요. 하지만 더 강한 분노가 깨어날지도 몰라요…',q:[['용왕 레이드 클리어','boss',1,'용왕 바르카스를 쓰러뜨려 주세요. 3페이즈를 조심하세요!','전설이 되셨군요! 이 보상을 받아주세요.',[20000,0,30,5]]].map(Q)}];
function talk(){if(!P||DLG||!NP[zn]||Math.abs(P.x-300)>90)return;DLG=1;dlg()}
let DPG=[],DPI=0;
const DX=[
{i:['이 마을은 대대로 슬라임 숲과 함께 살아왔지. 숲은 우리에게 약초와 땔감을 주었고, 우리는 숲의 균형을 지켰네.','그런데 보름 전부터 달라졌어. 얌전하던 슬라임들이 사람만 보면 달려들고, 숲 깊은 곳에서는 붉은 빛이 새어 나온다네.','옛 전설에 이르길, 마왕이 깨어날 때 숲의 짐승들이 먼저 광기에 물든다 했지… 자네가 그 전설을 끝내 줄 사람이길 바라네.'],a:[['먼저 숲의 슬라임부터 줄여야 하네. 숫자가 너무 늘어서 마을 사람들은 숲에 들어갈 엄두도 못 내고 있다네.'],['숲의 우두머리, 우리는 “젤리왕”이라 부르지. 그 녀석이 숲의 기운을 빨아들여 다른 슬라임을 미치게 만들고 있어.','조심하게. 덩치는 크지만 움직임은 둔하네. 틈을 보고 파고들게!']],d:[['정말 15마리나 잡았단 말인가? 숲이 벌써 조용해진 것 같네.'],['젤리왕이 쓰러지며 이상한 검은 돌을 남겼네. 마왕의 문장이 새겨져 있어…','역시 전설이 사실이었어. 폐광의 광부 브란에게 이 돌을 보여주게.']],r:['요즘 밤마다 숲에서 붉은 빛이 번쩍이는 걸 봤다는 아이들이 많다네.','내 손자도 자네처럼 용사가 되고 싶어 하지. 칼 대신 나무 막대기를 들고 설치고 있다네, 허허.','초보 시절엔 무리하지 말게. 쓰러져도 부활하지만, 포기하면 거기서 끝이야.','레벨이 오르면 스킬 포인트를 잊지 말고 투자하게. 20레벨에는 전직도 할 수 있다네.']},
{i:['나는 이 폐광에서 30년을 일한 광부 브란이다. 이 광산의 모든 갱도를 눈 감고도 걸을 수 있지!','그런데 한 달 전 고블린 떼가 쏟아져 나왔어. 놈들이 평소엔 이렇게 조직적이지 않거든. 누군가 놈들을 지휘하는 게 분명해.','광부 열두 명이 아직 갱도 안쪽에 갇혀 있어. 부탁이야, 도와줘!'],a:[['먼저 입구 근처 고블린부터 쓸어 줘. 놈들 곡괭이질에 갱도가 무너질 수도 있어!'],['갱도 가장 깊은 곳에 두목 고블린이 있어. 덩치도 크고 도끼도 두 자루야. 정면으로만 싸우지 말고 점프로 피해!']],d:[['고블린들이 물러났어! 이제 갱도가 숨을 쉬는 것 같군.'],['두목이 쓰러졌다고? 이건 마왕의 문장이 새겨진 돌이야… 마르코 촌장이 말한 게 이거였군!','이 돌은 얼음 협곡의 현자 엘사가 해석할 수 있을 거야. 그녀를 찾아가 봐.']],r:['고블린은 반짝이는 걸 좋아해. 그래서 광석을 훔쳐 가는 거지.','갱도 안쪽에는 아직 캐지 못한 희귀 광석이 있어. 평화가 오면 자네에게 제일 먼저 나눠 주지.','장비는 강화할수록 강해지지만 실패하면 한 단계 내려갈 수도 있어. +5 이상은 신중하게!','내 곡괭이 한 방이면 바위도 쪼개지만… 고블린 두목 앞에서는 손이 떨리더라고.']},
{i:['…어서 오세요. 이곳 얼음 협곡은 본래 고요한 곳이었어요. 수천 년간 얼음 속에 봉인된 힘을 지키는 것이 제 임무랍니다.','하지만 마왕의 기운이 스며들며 얼음이 깨어났어요. 정령들이 울부짖고, 협곡의 빙하가 하나둘 갈라지고 있어요.','당신이 가진 문장이 새겨진 돌은 마왕 봉인의 조각이에요. 총 셋이 모여야 마왕을 막을 수 있지요.'],a:[['먼저 폭주한 정령들을 진정시켜 주세요. 정령은 원래 자연의 수호자인데… 슬픈 일이에요.'],['협곡 깊은 곳 얼음 던전에 봉인의 조각이 있어요. 수호자는 얼음 마법에 능하니 거리를 두고 싸우세요.']],d:[['정령들이 편히 쉬게 되었군요. 감사해요.'],['봉인의 조각을 찾았군요! 이걸로 두 번째 조각이에요. 마지막 조각은 용족이 지키고 있답니다.','용의 계곡의 장로 이그니스를 찾아가세요. 그는 오만하지만 누구보다 마왕을 미워하지요.']],r:['협곡의 눈꽃은 한 송이마다 정령의 눈물이라 불려요. 아름답지만 가슴 아픈 이름이죠.','마법사 계열은 스킬 포인트를 화염구에 몰아주는 걸 좋아하더군요. 하지만 균형도 중요해요.','전직하면 한층 강해져요. 기사는 용을 타게 된답니다. 용기사의 모습은 정말 장엄하죠.','50레벨이 되면 용왕이 깨어난다는 예언도 있어요… 제 눈엔 아직도 선명하게 보여요.']},
{i:['인간이라… 오랜만이군. 나는 이 용의 계곡을 수천 년 지켜 온 이그니스다. 불꽃의 숨결로 이 계곡을 지켰지.','하지만 자랑스러운 용의 후예들이 마왕의 저주로 와이번처럼 변해 버렸다. 이것은 우리 용족의 치욕이다.','마지막 봉인의 조각은 내 보물창고에 있다. 허나, 그대의 힘을 먼저 증명해야 줄 수 있다.'],a:[['저주받은 와이번을 처치해 다오. 그들도 본래는 우리의 동족이었다. 이것은 자비의 칼이다.'],['고대 유적에는 수호룡이 있다. 나의 오랜 친구였지. 그가 더 이상 괴로워하지 않도록 해방시켜 주게.']],d:[['…고맙다. 동족들의 영혼이 하늘로 돌아가는 것이 느껴진다.'],['세 번째 봉인의 조각, 약속대로 건네주지. 이제 세 조각이 모두 모였다.','이 조각들을 가진 자는 마왕에게 맞설 자격이 있다. 마왕의 성으로 가거라. 그리고 반드시 이겨라!']],r:['용족은 기사 중에서도 진정한 용사에게만 등을 내어준다. 용기사가 되면 그 의미를 알게 될 것이다.','용의 불꽃은 단지 파괴가 아니다. 정화의 불꽃이기도 하지.','와이번의 비늘로 만든 장비는 특히 강하다. 용비늘 장비를 노려 보게.','50레벨이 되면 용왕 바르카스와 마주하게 될 것이다. 그는 우리의 왕이었으나… 지금은 분노에 사로잡혀 있다.']},
{i:['나는 왕국 기사단의 단장 레온이다. 우리 기사단은 마왕의 성을 포위하고 있지만, 성안으로 진입할 방법이 없어 막혀 있다.','마왕의 부하 마족은 하나하나가 정예 기사 셋의 힘을 가졌다. 병사들을 잃는 것이 두려워 진격 명령을 못 내리고 있어.','하지만 세 조각의 봉인을 지닌 자라면 얘기가 다르다. 그대가 길을 열어 주길 바란다.'],a:[['먼저 성문 앞의 마족을 정리해 줘. 놈들이 한 번에 몰려오기 전에 숫자를 줄여야 해.'],['성문 수문장을 쓰러뜨리지 못하면 어떤 군대도 진입할 수 없다. 수문장은 강력한 마법탄을 쏜다. 침착하게 피하며 싸워라!']],d:[['과연 소문대로군. 성문 앞이 한결 조용해졌다.'],['수문장이 무너졌다! 기사단 전체가 환호하고 있다.','이제 남은 건 마왕뿐이다. 그대가 50레벨에 도달하면 봉인의 힘이 완전히 개방된다. 그날을 기다리겠다.']],r:['내 검은 이제 세월에 무뎌졌지만, 자네 같은 젊은이의 검이 길을 열 것을 믿네.','마왕의 성에서는 전설 장비가 나온다고 하더군. 강화석도 넉넉히 챙겨 가게.','쓰러졌다고 포기하지 마라. 쓰러진 만큼 배우는 법이다.','성을 평정하면 이 왕국의 모든 마을에서 자네 이름을 노래할 거야.']},
{i:['…오래전 나도 그대처럼 검을 들고 이 자리에 섰었다. 하지만 결국 마왕에게 패배하고 유령이 되어 이곳에 머무르고 있다.','마왕은 두려움을 먹고 자라는 존재다. 쉽게 쓰러지지 않을 것이다. 그러나 그대에게는 세 개의 봉인이 있다.','나의 모든 힘을 그대에게 맡기겠다. 부디 이번에는… 이 지긋지긋한 악몽을 끝내 다오.'],a:[],d:[['…끝났는가? 정말로 끝난 것인가!','오랜 세월 나를 붙잡던 사슬이 풀리는 것이 느껴진다. 고맙다, 용사여.']],r:['마왕은 일정한 간격으로 탄막을 쏜다. 점프와 이동을 섞어서 피하는 게 요령이다.','신화 장비는 최종 보스의 선물이다. 반복 도전할수록 난이도가 올라가지만 더 강해질 것이다.','그대의 이름은 이제 전설이 될 것이다.','…하지만 평화 뒤에는 늘 새로운 위협이 도사리고 있지. 용왕의 분노를 조심하라.']},
{i:['오셨군요, 영웅이시여. 마왕이 쓰러진 뒤에도 평화는 오래가지 못했어요. 용왕 바르카스가 눈을 뜬 거예요.','그는 마왕의 저주에 오랜 세월 시달린 끝에 분노에 눈이 멀었어요. 이제는 적과 아군을 구분하지 못해요.','바르카스를 진정시킬 수 있는 건 마왕을 쓰러뜨린 당신뿐이에요. 하지만 그는 세 번 변신할 거예요. 각오하세요.'],a:[],d:[['…믿을 수가 없어요. 바르카스가 평온한 얼굴로 눈을 감았어요.','당신은 진정한 전설이에요. 하지만 그의 분노는 한층 더 강해져 돌아올지도 몰라요.']],r:['1페이즈에서는 침착하게 탄막을 피하세요. 2페이즈부터 졸개가 나와요!','3페이즈에서는 탄막이 매우 빨라져요. 스킬 쿨타임을 아껴 두세요.','신화 장비를 +10까지 강화하면 얼마나 강해질지 궁금하지 않으세요?','다시 도전할 때마다 용왕은 더 강해져요. 하지만 보상도 그만큼 커진답니다.']}];

 bar(150,y+26,230,12,P.lv>=50?1:P.xp/need(P.lv),'#fc3','EXP '+(P.lv>=50?'MAX':(P.xp/need(P.lv)*100).toFixed(1)+'%'));
 for(let i=0;i<3;i++){const x=520+i*60;g.fillStyle=P.sk[i]?'#456':'#2336';g.fillRect(x,y+5,54,36);g.fillStyle='#fff';g.font='11px sans-serif';g.fillText((i+1)+' '+CL[P.cls].s[i].slice(0,4),x+4,y+27);
  if(P.cd[i]>0){g.fillStyle='#000a';g.fillRect(x,y+5,54,36*P.cd[i]/[3,6,12][i])}}}
function renderUI(){if(!P)return;const c=CL[P.cls];
 let h=`<b>${c.t[P.tier]}</b> Lv.${P.lv}${P.clear?' · 칭호: 심연의 정복자':P.lv>=50?' · 칭호: 50레벨 달성자':''} · 💰${P.gold} · 💎강화석 ${P.st} · 스킬포인트 ${P.sp} · 📖 퀘스트 ${P.q.reduce((a,b)=>a+b,0)}/12<div>공격력 ${Math.floor(atk())} · 최대 HP ${Math.floor(mhp())}</div><div>`;
 h+=c.s.map((n,i)=>`<button onclick="use(${i})">[${i+1}] ${n} Lv${P.sk[i]}</button><button onclick="inv(${i})" ${P.sp&&P.sk[i]<10?'':'disabled'}>+</button>`).join(' ')+'</div>';
 for(const s of['w','a']){const it=P.eq[s];h+=`<div>${s=='w'?'무기':'방어구'}: ${it?nm(it)+' +'+it.plus+' ('+Math.floor(sc(it))+') <button onclick="enh(\''+s+'\')">강화</button>':'없음'}</div>`}
 h+=`<button onclick="bs()">강화석 구매 30G</button><button onclick="saveG(1)">💾 저장</button>`;
 if(P.tier<2&&P.lv>=20+20*P.tier)h+=`<button class="on" onclick="ct()">전직 → ${c.t[P.tier+1]}</button>`;
 h+='<div>'+ZN.map((n,i)=>`<button ${i==zn?'class="on"':''} ${P.lv<ZS[i]?'disabled':''} onclick="go(${i})">${n}</button>`).join('')+`</div>${zn==6?RD.map((r,i)=>`<button ${i==RT?'class="on"':''} onclick="setRT(${i})">${r.n} ${rdOK(i)?'🟢':'✔ '+rdLeft(r.k)}</button>`).join(''):''}${zn==6?'<br>'+BN.map((b,i)=>`<button ${i==RB?'class="on"':''} onclick="setRB(${i})">${b.n}</button>`).join('')+'<div style="font-size:12px;opacity:.8">🔒 도전할 때마다 1% 확률로 「봉쇄 용들의 레이드」가 열려요!</div>':'<br>'}<button onclick="sb()">${zn==6?'🐲 '+RD[RT].n+' · '+BN[RB].n+' 도전'+(rdOK(RT)?'':' (클리어 완료)'):zn==5?'최종 보스 도전 (난이도 '+(P.clear+1)+')':'지역 보스 소환'}</button>`;
 $('ui').innerHTML=h}
function inv(i){if(P.sp>0&&P.sk[i]<10){P.sp--;P.sk[i]++;renderUI()}}
function ct(){P.tier++;P.hp=mhp();log('✨ 전직 완료: '+CL[P.cls].t[P.tier]+' (공격력 상승)'+(P.cls=='기사'?' 🐉 용을 타고 전투합니다!':''));renderUI()}
function bs(){if(P.gold>=30){P.gold-=30;P.st++;renderUI()}else log('골드가 부족합니다')}
function sb(){if(!boss&&P.lv>=ZS[zn]){if(zn==6&&!rdOK(RT)){log('⏳ 이번 '+['일간','주간','월간'][RT]+' 레이드는 이미 클리어했어요. '+rdLeft(RD[RT].k)+' 초기화됩니다');return}if(zn>=5)E=[];if(zn==6){if(rnd()<.01){log('🔒 봉인이 풀린다…! 【봉쇄 용들의 레이드】가 열렸습니다!');shake=14;for(let i=0;i<3;i++){SPW={rb:i,sealed:1};spawn(true)}}else{SPW={rb:RB,sealed:0};spawn(true)}}else spawn(true)}}
function enh(s){const it=P.eq[s];if(!it||it.plus>=10)return;const n=it.plus+1;if(P.st<n)return log('강화석이 부족합니다 (필요 '+n+')');P.st-=n;
 if(Math.random()<Math.max(.3,1-.07*it.plus)){it.plus++;log('✅ 강화 성공 +'+it.plus)}else{if(it.plus>=5)it.plus--;log('❌ 강화 실패')}renderUI()}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k=='1'||k=='2'||k=='3')use(+k-1);if(k=='f')talk();if(k=='b')sb();if(k.startsWith('arrow')||k==' ')e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
document.querySelectorAll('#tc button').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();if(k=='f')talk();else if('123'.includes(k))use(+k-1);else keys[k]=1};b.onpointerup=b.onpointerleave=()=>{if(!'123'.includes(k))keys[k]=0}});
addEventListener('blur',()=>{keys={}});
C.addEventListener('pointerdown',ev=>{if(!P||DLG)return;const r=C.getBoundingClientRect(),wx=(ev.clientX-r.left)*W/r.width+cam;if(Math.abs(wx-P.x)>8)P.face=wx>P.x?1:-1;keys.x=1;ev.preventDefault()});
['pointerup','pointerleave','pointercancel'].forEach(t=>C.addEventListener(t,()=>{keys.x=0}));setInterval(()=>saveG(),5000);addEventListener('beforeunload',()=>saveG());addEventListener('pagehide',()=>saveG());if(hasSave())$('cont').style.display='';
(function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;upd(dt);draw();updSk();requestAnimationFrame(loop)})(0);
</script></body></html>
